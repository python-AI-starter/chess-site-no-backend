<script>
// apply the saved theme before first paint to avoid a light flash
try {
  if ((localStorage.getItem("ladya-theme") || "light") === "dark")
    document.documentElement.classList.add("dark");
} catch (e) {}
</script>
<script>
// Client-side cross-origin isolation: the service worker adds the COOP/COEP
// headers GitHub Pages cannot send, which enables SharedArrayBuffer and the
// multi-threaded engine build. Reloads once after registration; the
// sessionStorage guard prevents reload loops if isolation is not granted.
(function () {
  try {
    if (typeof crossOriginIsolated !== "undefined" && crossOriginIsolated) return;
    if (!window.isSecureContext || !navigator.serviceWorker) return;
    if (sessionStorage.getItem("ladya-coi")) return; // already retried this tab
    var FLAG = "ladya-coi";
    function done() { try { sessionStorage.setItem(FLAG, String(Date.now())); } catch (e) {} }
    var reloaded = false;
    function reloadOnce() {
      if (reloaded) return;
      reloaded = true;
      done();
      location.reload();
    }
    navigator.serviceWorker.register("coi-sw.js", { scope: "./" }).then(function (reg) {
      if (navigator.serviceWorker.controller) { reloadOnce(); return; }
      var w = reg.installing || reg.waiting;
      function onActive(r) { if (r && r.state === "activated") reloadOnce(); }
      if (reg.active) reloadOnce();
      if (w) {
        w.addEventListener("statechange", function () { onActive(w); });
      } else {
        reg.addEventListener("updatefound", function () {
          var n = reg.installing;
          if (n) n.addEventListener("statechange", function () { onActive(n); });
        });
      }
      navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
      // last resort: the worker may be active but slow to claim
      setTimeout(reloadOnce, 2500);
    }).catch(function () {});
  } catch (e) {}
})();
</script>
